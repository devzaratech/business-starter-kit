name: Repair npm lockfile (one-shot)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'feat/bsk-golden-path-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize lockfile registry URLs
        run: node scripts/quality/normalize-npm-lockfile.mjs --write

      - name: Verify normalized lockfile
        run: node scripts/quality/normalize-npm-lockfile.mjs --check

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already portable; nothing to commit."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(npm): normalize lockfile registry URLs"
          git push origin "HEAD:${{ github.head_ref }}"
