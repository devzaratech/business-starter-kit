name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - release/**
      - uat/**
  push:
    branches:
      - main
      - develop
      - release/**
      - uat/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-api-tests:
    name: Spring Boot API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-spring
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode test

  node-workspace-tests:
    name: Node, worker and web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: npm test

      - name: Build workspace artifacts
        run: npm run build --if-present

  docker-compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate VPS compose file
        run: docker compose -f infra/compose/docker-compose.vps.yml config

      - name: Validate environment compose files
        run: |
          for file in infra/compose/docker-compose.*.yml; do
            echo "Validating $file"
            docker compose -f "$file" config >/dev/null
          done

  sonarqube:
    name: SonarQube analysis (optional)
    runs-on: ubuntu-latest
    needs:
      - spring-api-tests
      - node-workspace-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarQube configuration
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube is configured; analysis will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube is not configured; skipping analysis."
          fi

      - name: Run SonarQube analysis
        if: steps.sonar_config.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: ./scripts/quality/run-sonar-scan.sh

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - spring-api-tests
      - node-workspace-tests
      - docker-compose-validation
    steps:
      - name: Mark quality gate as passed
        run: echo "All required CI checks passed."
