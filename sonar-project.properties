# SonarQube project configuration for Business Starter Kit.
#
# This file defines what SonarQube analyzes. The SonarQube server URL and token
# are NOT stored here; they are provided at scan time via environment variables
# (SONAR_HOST_URL, SONAR_TOKEN) or CI/CD secrets. See
# docs/ci-cd/sonarqube-strategy.md.

sonar.projectKey=business-starter-kit
sonar.projectName=Business Starter Kit
sonar.projectVersion=0.1.0

# Source and test layout across the monorepo.
sonar.sources=apps/api-spring/src/main,apps/api-node/src,apps/web/src,apps/worker/src,packages
sonar.tests=apps/api-spring/src/test,apps/api-node/test,apps/web/test,apps/worker/test

# Java (Spring Boot) settings.
sonar.java.source=17
sonar.java.binaries=apps/api-spring/target/classes

# Encoding.
sonar.sourceEncoding=UTF-8

# Exclusions: generated, vendored and non-source assets.
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/*.min.js,**/coverage/**

# Coverage report paths (populated once coverage tooling is enabled per module).
# sonar.javascript.lcov.reportPaths=apps/**/coverage/lcov.info
# sonar.coverage.jacoco.xmlReportPaths=apps/api-spring/target/site/jacoco/jacoco.xml
