# Supabase CLI configuration for the uat environment.
# This file is a source profile. The active file is generated at supabase/config.toml.
# Use: make supabase-start ENV=uat

project_id = "business-starter-kit-uat"

[api]
enabled = true
port = 35121
schemas = ["public", "api", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 35122
major_version = 15

shadow_port = 35120
[studio]
enabled = true
port = 35123
api_url = "http://127.0.0.1:35121"

[inbucket]
enabled = true
port = 35124
smtp_port = 35125
pop3_port = 35126

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:13080"
additional_redirect_urls = ["http://127.0.0.1:13080", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true

inspector_port = 35128
[analytics]
enabled = true
port = 35127
backend = "postgres"
