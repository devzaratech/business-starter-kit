# Supabase CLI configuration for the dev environment.
# This file is a source profile. The active file is generated at supabase/config.toml.
# Use: make supabase-start ENV=dev

project_id = "business-starter-kit-dev"

[api]
enabled = true
port = 15121
schemas = ["public", "api", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 15122
major_version = 15

shadow_port = 15120
[studio]
enabled = true
port = 15123
api_url = "http://127.0.0.1:15121"

[inbucket]
enabled = true
port = 15124
smtp_port = 15125
pop3_port = 15126

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:11080"
additional_redirect_urls = ["http://127.0.0.1:11080", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true

inspector_port = 15128
[analytics]
enabled = true
port = 15127
backend = "postgres"
