# Supabase CLI configuration for the staging environment.
# This file is a source profile. The active file is generated at supabase/config.toml.
# Use: make supabase-start ENV=staging

project_id = "business-starter-kit-staging"

[api]
enabled = true
port = 45121
schemas = ["public", "api", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 45122
major_version = 15

shadow_port = 45120
[studio]
enabled = true
port = 45123
api_url = "http://127.0.0.1:45121"

[inbucket]
enabled = true
port = 45124
smtp_port = 45125
pop3_port = 45126

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:14080"
additional_redirect_urls = ["http://127.0.0.1:14080", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true

inspector_port = 45128
[analytics]
enabled = true
port = 45127
backend = "postgres"
