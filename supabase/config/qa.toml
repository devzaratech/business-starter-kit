# Supabase CLI configuration for the qa environment.
# This file is a source profile. The active file is generated at supabase/config.toml.
# Use: make supabase-start ENV=qa

project_id = "business-starter-kit-qa"

[api]
enabled = true
port = 25121
schemas = ["public", "api", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 25122
major_version = 15

shadow_port = 25120
[studio]
enabled = true
port = 25123
api_url = "http://127.0.0.1:55221"

[inbucket]
enabled = true
port = 25124
smtp_port = 25125
pop3_port = 25126

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:12080"
additional_redirect_urls = ["http://127.0.0.1:12080", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
