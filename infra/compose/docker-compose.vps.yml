name: business-starter-kit

# Lean, VPS-first Compose stack.
#
# Default (lean) startup brings up only shared infrastructure so the stack stays
# cheap and fast on a small VPS:
#
#   docker compose -f infra/compose/docker-compose.vps.yml up -d
#
# To also build and run the application services + reverse proxy, enable the
# "apps" profile:
#
#   docker compose -f infra/compose/docker-compose.vps.yml --profile apps up -d
#
# Port convention:
# - Internal container ports stay stable across all environments.
# - Host ports and bind addresses are environment-specific through env files.
# - Administrative services bind to 127.0.0.1 by default and should be exposed
#   remotely only through VPN, SSH tunnels, Tailscale or Cloudflare Access.

services:
  # ----------------------------------------------------------------------------
  # Shared infrastructure (default lean stack)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bsk-${APP_ENV:-dev}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_starter}
      POSTGRES_USER: ${POSTGRES_USER:-business_starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-business_starter} -d ${POSTGRES_DB:-business_starter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bsk-internal

  redis:
    image: redis:7-alpine
    container_name: bsk-${APP_ENV:-dev}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsk-internal

  seaweed-master:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-${APP_ENV:-dev}-seaweed-master
    restart: unless-stopped
    command: "master -ip=seaweed-master -mdir=/data -volumeSizeLimitMB=1024"
    ports:
      - "${SEAWEED_MASTER_HOST_BIND:-127.0.0.1}:${SEAWEED_MASTER_HOST_PORT:-19333}:9333"
    volumes:
      - seaweed-master-data:/data
    networks:
      - bsk-internal

  seaweed-volume:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-${APP_ENV:-dev}-seaweed-volume
    restart: unless-stopped
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0"
    depends_on:
      - seaweed-master
    volumes:
      - seaweed-volume-data:/data
    networks:
      - bsk-internal

  seaweed-filer:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-${APP_ENV:-dev}-seaweed-filer
    restart: unless-stopped
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    ports:
      - "${SEAWEED_FILER_HOST_BIND:-127.0.0.1}:${SEAWEED_FILER_HOST_PORT:-18888}:8888"
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed-filer-data:/data
    networks:
      - bsk-internal

  seaweed-s3:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-${APP_ENV:-dev}-seaweed-s3
    restart: unless-stopped
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0"
    depends_on:
      - seaweed-filer
    ports:
      - "${SEAWEED_S3_HOST_BIND:-127.0.0.1}:${SEAWEED_S3_HOST_PORT:-8333}:8333"
    networks:
      - bsk-internal

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:1.121.0}
    container_name: bsk-${APP_ENV:-dev}-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change_me}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-business_starter}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-business_starter}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${N8N_HOST_BIND:-127.0.0.1}:${N8N_HOST_PORT:-15678}:5678"
      - "${N8N_HOST_BIND:-127.0.0.1}:${N8N_HOST_PORT:-5678}:${N8N_PORT:-5678}"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsk-internal

  # ----------------------------------------------------------------------------
  # Application services (opt-in via: --profile apps)
  # ----------------------------------------------------------------------------
  api-spring:
    build:
      context: ../../apps/api-spring
    image: bsk/api-spring:${IMAGE_TAG:-local}
    container_name: bsk-${APP_ENV:-dev}-api-spring
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-business_starter}
      POSTGRES_USER: ${POSTGRES_USER:-business_starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      API_PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - bsk-edge
      - bsk-internal

  api-node:
    build:
      context: ../../apps/api-node
    image: bsk/api-node:${IMAGE_TAG:-local}
    container_name: bsk-${APP_ENV:-dev}-api-node
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      PORT: 3001
    networks:
      - bsk-edge
      - bsk-internal

  api-fastapi:
    build:
      context: ../../apps/api-fastapi
    image: bsk/api-fastapi:${IMAGE_TAG:-local}
    container_name: bsk-${APP_ENV:-dev}-api-fastapi
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      PORT: 8000
    networks:
      - bsk-edge
      - bsk-internal


  api-php:
    build:
      context: ../../apps/api-php
    image: bsk/api-php:${IMAGE_TAG:-local}
    container_name: bsk-${APP_ENV:-dev}-api-php
    restart: unless-stopped
    profiles: ["php"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bsk-edge
      - bsk-internal

  worker:
    build:
      context: ../../apps/worker
    image: bsk/worker:${IMAGE_TAG:-local}
    container_name: bsk-${APP_ENV:-dev}-worker
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat.json
    networks:
      - bsk-internal

  web:
    build:
      context: ../../apps/web
    image: bsk/web:${IMAGE_TAG:-local}
    container_name: bsk-${APP_ENV:-dev}-web
    restart: unless-stopped
    profiles: ["apps"]
    networks:
      - bsk-edge
      - bsk-internal

  reverse-proxy:
    profiles:
      - single-env-proxy
    image: caddy:2-alpine
    container_name: bsk-${APP_ENV:-dev}-reverse-proxy
    restart: unless-stopped
    ports:
      - "${REVERSE_PROXY_HTTP_BIND:-0.0.0.0}:${REVERSE_PROXY_HTTP_PORT:-80}:80"
      - "${REVERSE_PROXY_HTTPS_BIND:-0.0.0.0}:${REVERSE_PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api-spring
      - api-node
    networks:
      - bsk-edge
      - bsk-internal

networks:
  bsk-edge:
    external: true
    name: bsk-edge
  bsk-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
  n8n-data:
  caddy-data:
  caddy-config:
