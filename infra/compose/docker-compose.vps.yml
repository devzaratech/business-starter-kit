name: business-starter-kit

# Lean, VPS-first Compose stack.
#
# Default (lean) startup brings up only shared infrastructure so the stack stays
# cheap and fast on a small VPS:
#
#   docker compose -f infra/compose/docker-compose.vps.yml up -d
#
# To also build and run the application services + reverse proxy, enable the
# "apps" profile:
#
#   docker compose -f infra/compose/docker-compose.vps.yml --profile apps up -d
#
# Production note: the host port mappings on postgres, redis, seaweed-s3 and n8n
# are convenient for local/dev access but should be removed (or bound to a
# private network / VPN) before exposing this stack to the public internet.

services:
  # ----------------------------------------------------------------------------
  # Shared infrastructure (default lean stack)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bsk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_starter}
      POSTGRES_USER: ${POSTGRES_USER:-business_starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-business_starter} -d ${POSTGRES_DB:-business_starter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bsk-internal

  redis:
    image: redis:7-alpine
    container_name: bsk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsk-internal

  seaweed-master:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-seaweed-master
    restart: unless-stopped
    command: "master -ip=seaweed-master -mdir=/data -volumeSizeLimitMB=1024"
    volumes:
      - seaweed-master-data:/data
    networks:
      - bsk-internal

  seaweed-volume:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-seaweed-volume
    restart: unless-stopped
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0"
    depends_on:
      - seaweed-master
    volumes:
      - seaweed-volume-data:/data
    networks:
      - bsk-internal

  seaweed-filer:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-seaweed-filer
    restart: unless-stopped
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed-filer-data:/data
    networks:
      - bsk-internal

  seaweed-s3:
    image: chrislusf/seaweedfs:3.94
    container_name: bsk-seaweed-s3
    restart: unless-stopped
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0"
    depends_on:
      - seaweed-filer
    ports:
      - "8333:8333"
    networks:
      - bsk-internal

  n8n:
    image: n8nio/n8n:latest
    container_name: bsk-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change_me}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-business_starter}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-business_starter}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsk-internal

  # ----------------------------------------------------------------------------
  # Application services (opt-in via: --profile apps)
  # ----------------------------------------------------------------------------
  api-spring:
    build:
      context: ../../apps/api-spring
    image: bsk/api-spring:${IMAGE_TAG:-local}
    container_name: bsk-api-spring
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-business_starter}
      POSTGRES_USER: ${POSTGRES_USER:-business_starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      API_PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - bsk-internal

  api-node:
    build:
      context: ../../apps/api-node
    image: bsk/api-node:${IMAGE_TAG:-local}
    container_name: bsk-api-node
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      PORT: 3001
    networks:
      - bsk-internal

  worker:
    build:
      context: ../../apps/worker
    image: bsk/worker:${IMAGE_TAG:-local}
    container_name: bsk-worker
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat.json
    networks:
      - bsk-internal

  web:
    build:
      context: ../../apps/web
    image: bsk/web:${IMAGE_TAG:-local}
    container_name: bsk-web
    restart: unless-stopped
    profiles: ["apps"]
    networks:
      - bsk-internal

  reverse-proxy:
    image: caddy:2-alpine
    container_name: bsk-reverse-proxy
    restart: unless-stopped
    profiles: ["apps"]
    ports:
      - "80:80"
      # - "443:443"   # enable once a real domain + TLS are configured
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api-spring
      - api-node
    networks:
      - bsk-internal

networks:
  bsk-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
  n8n-data:
  caddy-data:
  caddy-config:
